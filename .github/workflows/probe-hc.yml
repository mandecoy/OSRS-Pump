name: Probe Hardcore Worlds public price endpoints
on:
  push:
    paths:
      - '.github/workflows/probe-hc.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  endpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Confirm Hardcore World-specific price and volume API routes
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, json
          base='https://prices.runescape.wiki'
          headers={'User-Agent':'OSRS-Pump/0.4.3 (https://github.com/mandecoy/OSRS-Pump; GitHub issues)', 'Accept':'application/json'}
          for version in ('v2','v1'):
            for game in ('osrs-hc','osrs_hc','hc','hardcore'):
              url=f'{base}/api/{version}/{game}/latest'
              try:
                req=urllib.request.Request(url,headers=headers)
                with urllib.request.urlopen(req,timeout=8) as res:
                  data=json.load(res)
                  count=len(data.get('data',data)) if isinstance(data,dict) else len(data)
                  print(f'PROBE {url}: OK entries={count}',flush=True)
              except Exception as e:
                print(f'PROBE {url}: {type(e).__name__} {str(e)[:160]}',flush=True)
          for path in ('/api/v2/osrs-hc/24h','/api/v1/osrs-hc/24h','/api/v2/osrs-hc/1h','/api/v1/osrs-hc/1h','/api/v2/osrs-hc/mapping','/api/v1/osrs-hc/mapping'):
            try:
              req=urllib.request.Request(base+path,headers=headers)
              with urllib.request.urlopen(req,timeout=8) as res:
                data=json.load(res)
                count=len(data.get('data',data)) if isinstance(data,dict) else len(data)
                print(f'PROBE {path}: OK count={count}',flush=True)
            except Exception as e:
              print(f'PROBE {path}: {type(e).__name__} {str(e)[:160]}',flush=True)

          for p in ('5m','timeseries?id=4151&lookback=24h','timeseries?id=4151&lookback=7d','timeseries?id=4151&lookback=30d','timeseries?id=4151&lookback=90d','timeseries?id=4151&timestep=1h'):
            url=f'{base}/api/v2/osrs-hc/{p}'
            try:
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=8) as res:
                body=json.load(res)
                print(f'ENDPOINT {p}: OK keys={list(body)[:8] if isinstance(body,dict) else "array"} sample={str((body.get("data") or [])[:1] if isinstance(body.get("data"),list) else list((body.get("data") or {}).items())[:1])[:300]}',flush=True)
            except Exception as e:
              print(f'ENDPOINT {p}: {type(e).__name__} {str(e)[:150]}',flush=True)
          PY
