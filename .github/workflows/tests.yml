name: Test
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check app.js && node --check market-intel.js && node --check v03.js && node --check history-chart.js && node --check server.js && node --check logic.js
