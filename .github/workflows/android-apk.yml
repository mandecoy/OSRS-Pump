name: Android APK
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'app.js'
      - 'v03.js'
      - 'v03.css'
      - 'logic.js'
      - 'styles.css'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'icons/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify JavaScript and market-screen calculations
        run: |
          npm test
          npm run check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Use preinstalled GitHub runner Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Install Android SDK platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Package local UI as Android assets
        shell: bash
        run: |
          mkdir -p android/app/src/main/assets/web/icons
          cp index.html app.js v03.js logic.js styles.css v03.css manifest.webmanifest android/app/src/main/assets/web/
          cp icons/pump.svg android/app/src/main/assets/web/icons/
          python3 - <<'PY'
          from pathlib import Path
          path=Path('android/app/src/main/assets/web/app.js')
          source=path.read_text()
          old="function download(data,name){"
          assert old in source
          source=source.replace(old,old+"if(globalThis.OSRSPumpAndroid){globalThis.OSRSPumpAndroid.saveBackup(data);return;}",1)
          # The native bridge serves local assets and API calls; no SW needed.
          old_sw="if('serviceWorker' in navigator)"
          assert old_sw in source
          source=source.replace(old_sw,"if(!navigator.userAgent.includes('OSRSPumpNative') && 'serviceWorker' in navigator)",1)
          path.write_text(source)
          PY
      - name: Build debug-signed Android APK
        run: gradle -p android --no-daemon --stacktrace assembleDebug
      - name: Verify APK exists
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk OSRS-Pump-v0.3.1-beta.1.apk
          sha256sum OSRS-Pump-v0.3.1-beta.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OSRS-Pump-Android-v0.3.1-beta.1
          path: OSRS-Pump-v0.3.1-beta.1.apk
          retention-days: 30
      - name: Publish downloadable GitHub beta release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.3.1-beta.1 >/dev/null 2>&1; then
            gh release create v0.3.1-beta.1 OSRS-Pump-v0.3.1-beta.1.apk \
              --prerelease \
              --title "OSRS Pump Android v0.3.1 beta 1" \
              --notes "Fixes sparse Markets categories, broken default filters and 10-item Load More pagination; shows 24h item volumes, searchable item names in watchlist alerts and trade journal, and expanded High Alchemy sourced across all eligible mapping items. GE flip profits remain after-tax. Alerts evaluate only while the app is open. Debug-signed: back up your trades before any reinstall."
          fi
